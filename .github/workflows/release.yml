---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_digest: ${{ steps.immutable-image.outputs.digest }}
      stable: ${{ steps.release.outputs.stable }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver_regex ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          {
            echo "date=$(git show -s --format=%cI "$GITHUB_SHA")"
            echo "stable=$stable"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check existing release state
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/gopod-release-view.err"
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>"$error_file")"; then
            if [ "$is_draft" = "true" ]; then
              state=draft
            else
              state=published
            fi
          elif grep -Fqi "release not found" "$error_file"; then
            state=missing
          else
            cat "$error_file" >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          cache: true

      - name: Run release checks
        run: mise run ci

      - name: Build native release snapshot
        run: mise run release:snapshot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build all container platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gopod:release-candidate
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release.outputs.date }}
          cache-from: type=gha

      - name: Smoke-test release candidate
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/gopod-data"
          config_dir="$RUNNER_TEMP/gopod-config"
          tmp_dir="$RUNNER_TEMP/gopod-tmp"
          mkdir -p "$data_dir" "$config_dir" "$tmp_dir"
          chmod 0777 "$data_dir" "$tmp_dir"
          touch "$config_dir/config.json"
          printf '@hourly /usr/local/bin/gopod --version\n' > "$config_dir/crontab"

          docker run --rm gopod:release-candidate --version
          docker run --rm --entrypoint ffmpeg gopod:release-candidate -version
          docker run --rm \
            --entrypoint supercronic \
            --volume "$config_dir:/config:ro" \
            gopod:release-candidate -test /config/crontab
          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --entrypoint sh \
            --volume "$data_dir:/data" \
            gopod:release-candidate \
            -c 'test "$(id -u)" -ne 0 && touch /data/write-test'

          GOPOD_CONFIG_DIR="$config_dir" \
          GOPOD_DATA_PATH="$data_dir" \
          GOPOD_TMP_PATH="$tmp_dir" \
          docker compose \
            --env-file deploy/portainer/.env.example \
            --file deploy/portainer/compose.yaml \
            config >/dev/null

      - name: Publish draft GitHub Release
        if: steps.release-state.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:publish

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable container metadata
        id: container
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=GoPod
            org.opencontainers.image.description=Record online radio streams and publish podcast feeds
            org.opencontainers.image.created=${{ steps.release.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.created=${{ steps.release.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Publish immutable container image
        id: push-image
        if: steps.release-state.outputs.state != 'published'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container.outputs.tags }}
          labels: ${{ steps.container.outputs.labels }}
          annotations: ${{ steps.container.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify immutable container image
        id: verified-image
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_TAG: ${{ steps.container.outputs.tags }}
          PUSHED_DIGEST: ${{ steps.push-image.outputs.digest }}
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAG" ] || [[ "$IMAGE_TAG" == *$'\n'* ]]; then
            echo "Expected exactly one immutable image tag, got: $IMAGE_TAG" >&2
            exit 1
          fi

          error_file="$RUNNER_TEMP/gopod-image-inspect.err"
          if ! manifest_json="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .}}' 2>"$error_file")"; then
            cat "$error_file" >&2
            exit 1
          fi

          digest="$(jq -r '.manifest.digest // ""' <<< "$manifest_json")"
          revision="$(jq -r '.manifest.annotations["org.opencontainers.image.revision"] // ""' <<< "$manifest_json")"
          version="$(jq -r '.manifest.annotations["org.opencontainers.image.version"] // ""' <<< "$manifest_json")"
          platforms="$(
            jq -r '
              [
                .manifest.manifests[]?
                | select(.platform.os != "unknown")
                | "\(.platform.os)/\(.platform.architecture)"
              ]
              | unique
              | sort
              | join(",")
            ' <<< "$manifest_json"
          )"
          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "Image revision $revision does not match $EXPECTED_REVISION" >&2
            exit 1
          fi
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "Image version $version does not match $EXPECTED_VERSION" >&2
            exit 1
          fi
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Image platforms $platforms do not match linux/amd64,linux/arm64" >&2
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Image has invalid digest: $digest" >&2
            exit 1
          fi
          if [ "$RELEASE_STATE" != "published" ] && [ "$digest" != "$PUSHED_DIGEST" ]; then
            echo "Registry image digest $digest does not match pushed digest $PUSHED_DIGEST" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record or verify immutable image digest
        id: immutable-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_DIGEST: ${{ steps.verified-image.outputs.digest }}
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          digest_file="$RUNNER_TEMP/container-digest.txt"

          if [ "$RELEASE_STATE" = "published" ]; then
            gh release download "$GITHUB_REF_NAME" \
              --pattern container-digest.txt \
              --output "$digest_file"
            expected_digest="$(tr -d '\r\n' < "$digest_file")"
            if [ "$VERIFIED_DIGEST" != "$expected_digest" ]; then
              echo "Published image digest $VERIFIED_DIGEST does not match release asset $expected_digest" >&2
              exit 1
            fi
            digest="$VERIFIED_DIGEST"
          else
            digest="$VERIFIED_DIGEST"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Immutable image has invalid digest: $digest" >&2
              exit 1
            fi
            printf '%s\n' "$digest" > "$digest_file"
            gh release upload "$GITHUB_REF_NAME" "$digest_file" --clobber
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Immutable image has invalid digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release-state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest=false \
            --prerelease=${{ steps.release.outputs.stable == 'false' }}

  promote:
    name: Promote stable container tags
    needs: publish
    if: needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote major, minor, and latest tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ needs.publish.outputs.version }}"
          core_version="$version"
          IFS=. read -r major minor _patch <<< "$core_version"
          source_image="$image@${{ needs.publish.outputs.image_digest }}"
          tag_args=()
          stable_semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          releases_json="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          )"
          highest_published_version="$(
            while IFS= read -r tag; do
              if [[ "$tag" =~ $stable_semver_regex ]]; then
                printf '%s\n' "${tag#v}"
              fi
            done < <(
              jq -r '
                .[][]
                | select(.draft == false and .prerelease == false)
                | .tag_name
              ' <<< "$releases_json"
            ) | sort -V | tail -n 1
          )"
          if [ -z "$highest_published_version" ]; then
            echo "No published stable release is available for promotion" >&2
            exit 1
          fi

          consider_tag() {
            local moving_tag=$1
            local target_image="$image:$moving_tag"
            local error_file="$RUNNER_TEMP/gopod-promote-${moving_tag//./-}.err"
            local manifest_json current_version highest_version

            if manifest_json="$(docker buildx imagetools inspect "$target_image" --format '{{json .}}' 2>"$error_file")"; then
              current_version="$(jq -r '.manifest.annotations["org.opencontainers.image.version"] // ""' <<< "$manifest_json")"
              if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "Moving tag $target_image has invalid version annotation: $current_version" >&2
                exit 1
              fi
              highest_version="$(printf '%s\n%s\n' "$current_version" "$version" | sort -V | tail -n 1)"
              if [ "$highest_version" = "$version" ] && [ "$current_version" != "$version" ]; then
                tag_args+=(--tag "$target_image")
              else
                echo "Leaving $target_image at $current_version"
              fi
            elif grep -Eqi "manifest unknown|not found|does not exist" "$error_file"; then
              tag_args+=(--tag "$target_image")
            else
              cat "$error_file" >&2
              exit 1
            fi
          }

          consider_tag "$major.$minor"
          consider_tag "$major"
          if [ "$version" = "$highest_published_version" ]; then
            consider_tag latest
          fi

          if [ "${#tag_args[@]}" -gt 0 ]; then
            docker buildx imagetools create "${tag_args[@]}" "$source_image"
          fi

          gh release edit "v$highest_published_version" --latest
