---
name: "GoPod Linter (Required)"
run-name: "Linter (Required)"
on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:
  merge_group:

jobs:
  gopod-linter:
    permissions:
      id-token: write
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Go modules
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.59.0  # Or latest stable supported by your code
          args: --timeout=5m
          only-new-issues: true
          # Remove or add any args needed for your repo
