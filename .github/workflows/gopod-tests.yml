---
name: "GoPod Tests (Required)"
run-name: "GoPod Tests (Required)"
on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:
  merge_group:

jobs:
  gopod-tests:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest-xl

    permissions:
      id-token: write
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24'

      - name: Check Go source files are properly formatted
        run: gofmt -s -w . && git diff --exit-code

      - name: No changes to go.sum
        run: |
          go mod tidy
          git diff --exit-code go.sum
          if [ $? -ne 0 ]; then
            echo "Error: go.sum changed, run `go mod tidy` and commit result"
            exit 1
          fi

      - name: Go Mod Verify
        run: go mod verify

      - name: Build program
        run: go build

      - name: Run tests
        run: go test ./...
