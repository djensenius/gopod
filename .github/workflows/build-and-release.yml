---
name: Build and Release

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries for multiple platforms
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64  go build -o dist/gopod-linux-amd64
          GOOS=linux   GOARCH=arm64  go build -o dist/gopod-linux-arm64
          GOOS=windows GOARCH=amd64  go build -o dist/gopod-windows-amd64.exe
          GOOS=windows GOARCH=arm64  go build -o dist/gopod-windows-arm64.exe
          GOOS=darwin  GOARCH=arm64  go build -o dist/gopod-darwin-arm64

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gopod-linux-amd64
            dist/gopod-linux-arm64
            dist/gopod-windows-amd64.exe
            dist/gopod-windows-arm64.exe
            dist/gopod-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
